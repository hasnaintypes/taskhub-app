@if (authService.isAuthenticated()) {
  <mat-toolbar color="primary">
    <span class="brand">TaskHub</span>
    <a mat-button routerLink="/dashboard">Dashboard</a>
    <a mat-button routerLink="/tasks">Tasks</a>
    @if (authService.canManageTasks()) {
      <a mat-button routerLink="/users">Users</a>
    }
    <span class="spacer"></span>
    <span class="role-badge">{{ authService.currentUser()?.username }} · {{ authService.role() }}</span>
    <button mat-icon-button (click)="logout()" aria-label="Log out">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>
}

<router-outlet></router-outlet>
